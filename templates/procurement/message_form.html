{% extends "base.html" %}
{% block content %}
<div class="page-heading">
  <div>
    <p class="eyebrow">Clarification</p>
    <h1 class="h3 mb-1">New message</h1>
  </div>
</div>

<form method="post" class="work-panel message-compose">
  {% csrf_token %}
  <div class="panel-header">
    <div><h2>Message details</h2><p>Send a clarification to a school, supplier, admin, or viewer.</p></div>
  </div>
  <div class="form-grid">
    {% for field in form %}
    <div class="field-block {% if field.name == 'body' or field.name == 'subject' %}field-block--wide{% endif %}">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="field-errors">{{ field.errors }}</div>{% endif %}
    </div>
    {% endfor %}
  </div>
  <div class="form-actions">
    <a href="{% url 'messages_page' %}" class="btn btn-outline-secondary">Cancel</a>
    <button class="btn btn-primary btn-lg" type="submit">Send message</button>
  </div>
</form>
{% endblock %}
