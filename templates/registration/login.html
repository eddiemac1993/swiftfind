{% extends "base.html" %}
{% block title %}Login - SchoolProcure{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">SchoolProcure Login</h1>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
        <p class="text-muted small mt-3 mb-0">Test users: <code>admin</code>, <code>school</code>, <code>supplier</code>. Password: <code>12345678</code>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
